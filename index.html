<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 아이스 커피 레시피북</title><style>
:root{--bg:#f7f3ed;--card:#fffdfa;--ink:#29231f;--muted:#746a61;--line:#e5d9cc;--accent:#8a5838}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}main{max-width:960px;margin:auto;padding:28px 16px 80px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin:14px 0}.hero{background:#efe3d6}.hero h1{margin:0 0 8px}.muted{color:var(--muted);line-height:1.55}.toolbar{position:sticky;top:0;z-index:5;background:rgba(247,243,237,.95);padding:8px 0}.fg{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:3px 0}.fg b{min-width:62px;font-size:12px;color:var(--muted)}button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;white-space:nowrap}button.on{background:#302820;color:#fff}#q{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px}.head{display:flex;justify-content:space-between;gap:10px}.chip{font-size:12px;color:var(--accent);font-weight:700}.badge{font-size:12px;background:#f4ead8;border-radius:999px;padding:6px 9px;height:max-content}.good{background:#e5f0e4}.goal{margin:12px 0;padding:12px;background:#faf2e9;border-left:4px solid var(--accent)}.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.spec{border:1px solid #eee4da;border-radius:10px;padding:10px}.spec b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.dose{display:flex;gap:6px;align-items:center}.dose input{width:72px;padding:6px}.step{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #eee5dc;line-height:1.55}.time{font-weight:700;color:var(--accent)}h2{font-size:21px;margin:4px 0}h3{font-size:16px;margin:18px 0 6px}ul{margin-top:4px;line-height:1.7}@media(max-width:560px){.head{display:block}.badge{display:inline-block;margin-top:6px}.step{grid-template-columns:64px 1fr}}</style></head><body><main>
<section class="hero"><h1>나의 아이스 커피 레시피북</h1><div class="muted">WaBliss 3.0 · HARIO V60 NEO · 빈플러스 드리퍼<br>모든 레시피는 ICE 기준. 원두량을 바꾸면 물·얼음·푸어량이 자동으로 비례 계산됩니다.</div></section>
<div class="toolbar"><div id="filters"></div><input id="q" placeholder="원두명, 컵노트, 분쇄도 검색"></div><div id="list"></div>
<script>
const R=[
{t:'핑크 버번 허니 리치 — ICE',cat:'bean',status:'verified',roast:'unknown',drip:'neo',flavor:'bright',proc:'honey',dose:18,grind:'52',temp:'93–95℃',hot:300,ice:'100–150',goal:'리치에이드처럼 화사하고 상큼한 향미.',src:'실제 성공 세팅',steps:[['준비','서버에 얼음 {100-150}g. 원두 {18}g을 WaBliss 52로 분쇄.'],['0:00','{36}g까지 적시고 30–40초 뜸.'],['0:40','누적 {120}g까지 +{84}g. 작은 원을 그리며 푸어.'],['1:10','누적 {192}g까지 +{72}g.'],['1:40','누적 {252}g까지 +{60}g.'],['2:10','누적 {300}g까지 +{48}g. 물 빠지면 제거 후 충분히 칠링.']],adj:['시고 날카로우면 50–51로 곱게.','쓰고 텁텁하면 53–55로 굵게.','밍밍하면 얼음이나 총 주입수를 소폭 줄이기.']},
{t:'20g / 300g 연속 푸어 — ICE',cat:'brew',status:'untested',roast:'unknown',drip:'neo',flavor:'balanced',proc:'unknown',dose:20,grind:'72–78 시작(가설)',temp:'95–96℃',hot:300,ice:'100–120',goal:'아주 굵은 분쇄와 잦은 푸어로 향을 선명하게.',src:'캡처 원본: 코만단테 40–45클릭, 15초 간격 30g',steps:[['0:00','{30}g 뜸.'],['0:30','누적 {60}g. 이후 15초마다 +{30}g.'],['2:30','누적 {300}g 마지막 푸어.'],['마무리','총 3:00–3:30 종료를 목표로 확인 후 칠링.']],adj:['너무 빨리 끝나고 비면 3–5눈금 곱게.','3:30을 크게 넘기고 떫으면 3–5눈금 굵게.','연하면 얼음을 줄이거나 주입수를 260–280g으로.']},
{t:'양지훈 1:3:9 — ICE',cat:'brew',status:'untested',roast:'unknown',drip:'neo',flavor:'balanced',proc:'unknown',dose:15,grind:'50–54 시작(가설)',temp:'92℃',hot:135,ice:'적정량',goal:'짧고 진한 추출 뒤 가수해 향을 깨끗하게.',src:'원본: 코만단테 약 20클릭 / EK43S 10–11',steps:[['0:00','약 {30}g 뜸.'],['0:30','본 추출 시작. 1:3 구조에 맞춰 진한 추출액 확보.'],['약 1:30','흐름과 추출량 확인.'],['가수','1:9 의도를 유지하되 ICE는 녹는 얼음까지 포함해 조절.']],adj:['너무 진하면 가수량 증가.','산미만 튀면 1–2눈금 곱게.','쓴맛·떫은맛이 강하면 2–3눈금 굵게.']},
{t:'양지훈 1:5:5 — ICE',cat:'brew',status:'untested',roast:'unknown',drip:'neo',flavor:'balanced',proc:'unknown',dose:20,grind:'50–53 시작(가설)',temp:'92℃',hot:100,ice:'가수 100g 상당',goal:'진한 100g 추출 후 같은 양 가수로 향과 농도를 정돈.',src:'원본: 코만단테 18–20클릭 / EK43S 10.5–11.5',steps:[['0:00','약 {40}g 뜸.'],['0:30','가운데 위주로 본 추출 시작.'],['본 추출','추출된 커피 약 {100}g을 목표.'],['가수','물/얼음으로 약 {100}g 상당 추가 후 칠링.']],adj:['너무 진하면 가수 +10–20g.','산미가 거칠면 1–2눈금 곱게.','텁텁하면 2–3눈금 굵게.']},
{t:'수박 향 원두 — ICE 테스트',cat:'bean',status:'untested',roast:'unknown',drip:'neo',flavor:'bright',proc:'unknown',dose:20,grind:'52 전후 시작',temp:'94℃',hot:220,ice:'약 120',goal:'수박·메론 향과 산뜻한 단맛.',src:'판매처 권장: 20g / 94℃ / 180mL / 1:50±10초',steps:[['준비','서버에 얼음 {120}g.'],['0:00','{40}g, 35–40초 뜸.'],['0:40','누적 {100}g까지 적극적으로 1차 푸어.'],['1:05','누적 {160}g.'],['1:30','누적 {220}g 마무리.']],adj:['시고 날카로우면 50–51.','쓰거나 텁텁하면 53–55.','수박/메론 향이 약하면 1차 푸어 비중 증가.']},
{t:'만능 밸런스 ICE — Hoffmann 급랭식',cat:'brew',status:'untested',roast:'all',drip:'neo',flavor:'balanced',proc:'unknown',dose:19.5,grind:'50–53 시작',temp:'95℃',hot:180,ice:'120',goal:'처음 사는 원두의 성격을 균형 있게 확인.',src:'James Hoffmann Japanese-style iced filter 기반',steps:[['준비','서버에 얼음 {120}g.'],['0:00','{39}g 뜸 후 가볍게 스월.'],['0:45','천천히 누적 {180}g까지 연속 푸어.'],['2:30–3:00','드로다운 후 서버를 돌려 남은 얼음을 녹이고 서빙.']],adj:['시고 얇으면 1–2눈금 곱게.','쓰고 마르면 1–3눈금 굵게.']},
{t:'고소·단맛 ICE — Kasuya 4:6 Sweet',cat:'brew',status:'untested',roast:'medium-dark',drip:'neo',flavor:'nutty',proc:'unknown',dose:20,grind:'58–64 시작(굵게)',temp:'90–92℃',hot:180,ice:'120',goal:'견과류·초콜릿·카라멜 계열의 단맛과 바디 강조.',src:'Tetsu Kasuya 공식 4:6 원리 기반',steps:[['준비','서버에 얼음 {120}g.'],['0:00','{30}g.'],['0:45','+{42}g → 누적 {72}g.'],['1:30','+{36}g → {108}g.'],['2:10','+{36}g → {144}g.'],['2:40','+{36}g → {180}g 후 칠링.']],adj:['답답하면 92–93℃ 또는 1–2눈금 굵게.','산미가 튀면 첫 푸어를 줄이고 두 번째에 더하기.']},
{t:'화사·과일향 ICE — High Aroma',cat:'brew',status:'untested',roast:'light',drip:'neo',flavor:'bright',proc:'unknown',dose:19.5,grind:'49–52 시작',temp:'95–96℃',hot:180,ice:'120',goal:'자스민·베리·시트러스·열대과일 향을 선명하게.',src:'Hoffmann 급랭식 비율 + 고온 추출 원리',steps:[['준비','서버에 얼음 {120}g.'],['0:00','{39}g 뜸.'],['0:45','누적 {110}g까지 작은 원으로 푸어.'],['1:15','누적 {180}g까지 중앙 위주 마무리.'],['2:30–3:00','드리퍼 제거 후 강하게 스월해 급랭.']],adj:['시기만 하면 1눈금 곱게 또는 온도 +1℃.','떫으면 1–2눈금 굵게.']}
];
const F={category:['전체|all','🫘 원두별|bean','🧪 브루잉|brew'],roast:['전체|all','약배전|light','중·강배전|medium-dark','미확인|unknown'],dripper:['전체|all','V60 NEO|neo','빈플러스|beanplus','공용|universal'],flavor:['전체|all','🍋 산미·화사|bright','🌰 고소·단맛|nutty','⚖️ 공용·밸런스|balanced'],process:['전체|all','워시드|washed','내추럴|natural','허니|honey','발효·무산소|fermented','기타·미확인|unknown'],status:['전체|all','⭐ 검증 완료|verified','테스트 전|untested']};
const L={category:'📚 종류',roast:'🔥 배전도',dripper:'☕ 드리퍼',flavor:'👅 맛 방향',process:'🫘 가공',status:'⭐ 상태'};let S={category:'all',roast:'all',dripper:'all',flavor:'all',process:'all',status:'all'};
const fmt=n=>{n=Math.round(n*2)/2;return Number.isInteger(n)?n:n.toFixed(1)};function scaleText(x,r){return x.replace(/\{([0-9.]+)(?:-([0-9.]+))?\}/g,(_,a,b)=>b?fmt(+a*r)+'–'+fmt(+b*r):fmt(+a*r))}
function filters(){filtersEl.innerHTML=Object.entries(F).map(([k,a])=>`<div class=fg><b>${L[k]}</b>${a.map(x=>{let [n,v]=x.split('|');return `<button class="${S[k]==v?'on':''}" data-k=${k} data-v=${v}>${n}</button>`}).join('')}</div>`).join('');filtersEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{S[b.dataset.k]=b.dataset.v;filters();render()})}
function ok(r){for(const[k,v]of Object.entries(S)){if(v==='all')continue;let x=k==='category'?r.cat:k==='dripper'?r.drip:k==='process'?r.proc:r[k];if(k==='roast'&&r.roast==='all'&&(v==='light'||v==='medium-dark'))continue;if(x!==v)return false}return true}
function render(){let q=document.querySelector('#q').value.toLowerCase();list.innerHTML=R.filter(r=>ok(r)&&JSON.stringify(r).toLowerCase().includes(q)).map((r,i)=>card(r,i)).join('');document.querySelectorAll('.doseIn').forEach(x=>x.oninput=render)}
function card(r,i){let el=document.activeElement,cur=el&&el.dataset&&+el.dataset.i===i?+el.value:r.dose,ratio=cur/r.dose;let gs=x=>typeof x==='number'?fmt(x*ratio)+'g':scaleText('{'+x+'}',ratio)+'g';let st=r.steps.map(s=>`<div class=step><div class=time>${s[0]}</div><div>${scaleText(s[1],ratio)}</div></div>`).join('');return `<article class=card><div class=head><div><div class=chip>${r.cat==='bean'?'🫘 원두별 맞춤':'🧪 브루잉 레시피'}</div><h2>${r.t}</h2><div class=muted>${r.src}</div></div><span class="badge ${r.status==='verified'?'good':''}">${r.status==='verified'?'★ 검증 완료':'○ 테스트 전'}</span></div><div class=goal><b>맛의 목표</b><br>${r.goal}</div><div class=specs><div class=spec><b>원두량</b><div class=dose><input class=doseIn data-i=${i} type=number step=.5 min=5 max=60 value=${cur}><span>g</span></div></div><div class=spec><b>드리퍼</b>HARIO V60 NEO</div><div class=spec><b>WaBliss 3.0</b>${r.grind}</div><div class=spec><b>물 온도</b>${r.temp}</div><div class=spec><b>뜨거운 물</b>${gs(r.hot)}</div><div class=spec><b>서버 얼음</b>${gs(r.ice)}</div></div><h3>⏱ 따라 하기</h3>${st}<h3>🎯 마셔보고 조정</h3><ul>${r.adj.map(x=>`<li>${x}</li>`).join('')}</ul></article>`}
const filtersEl=document.querySelector('#filters'),list=document.querySelector('#list');filters();render();document.querySelector('#q').oninput=render;
</script></main></body></html>
