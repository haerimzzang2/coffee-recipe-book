const F={category:['전체|all','🫘 원두별|bean','🧪 브루잉|brew'],roast:['전체|all','약배전|light','중배전|medium','강배전|dark','⚖️ 공용|common','미확인|unknown'],dripper:['전체|all','V60 NEO|neo','빈플러스|beanplus','⚖️ 공용|universal'],flavor:['전체|all','🍋 산미·화사|bright','🌰 고소·단맛|nutty','⚖️ 공용·밸런스|balanced'],process:['전체|all','워시드|washed','내추럴|natural','허니|honey','발효·무산소|fermented','기타·미확인|unknown'],status:['전체|all','⭐ 검증 완료|verified','○ 테스트 전|untested']};
const L={category:'📚 종류',roast:'🔥 배전도',dripper:'☕ 드리퍼',flavor:'👅 맛 방향',process:'🫘 가공',status:'⭐ 상태'};let S={category:'all',roast:'all',dripper:'all',flavor:'all',process:'all',status:'all'};const fmt=n=>{n=Math.round(n*2)/2;return Number.isInteger(n)?n:n.toFixed(1)};function scaleText(x,r){return String(x).replace(/\{([0-9.]+)(?:-([0-9.]+))?\}/g,(_,a,b)=>b?fmt(+a*r)+'–'+fmt(+b*r):fmt(+a*r))}function filters(){filtersEl.innerHTML=Object.entries(F).map(([k,a])=>`<div class=fg><b>${L[k]}</b>${a.map(x=>{let[n,v]=x.split('|');return `<button class="${S[k]===v?'on':''}" data-k="${k}" data-v="${v}">${n}</button>`}).join('')}</div>`).join('');filtersEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{S[b.dataset.k]=b.dataset.v;filters();render()})}function val(r,k){return k==='category'?r.cat:k==='dripper'?r.drip:k==='process'?r.proc:r[k]}function ok(r){for(const[k,v]of Object.entries(S)){if(v!=='all'&&val(r,k)!==v)return false}return true}function render(){const q=document.querySelector('#q').value.toLowerCase();list.innerHTML=R.filter(r=>ok(r)&&JSON.stringify(r).toLowerCase().includes(q)).map((r,i)=>card(r,i)).join('');document.querySelectorAll('.doseIn').forEach(x=>{x.onchange=()=>{doseMap[x.dataset.i]=+x.value;render()}})}const doseMap={};function card(r,i){const cur=doseMap[i]||r.dose,ratio=cur/r.dose;const sg=x=>typeof x==='number'?fmt(x*ratio)+'g':scaleText(String(x),ratio).replace(/(^|\s)(\d+(?:\.\d+)?)(?=\s|$)/g,'$1$2');const st=r.steps.map(s=>`<div class=step><div class=time>${s[0]}</div><div>${scaleText(s[1],ratio)}</div></div>`).join('');return `<article class=card><div class=head><div><div class=chip>${r.cat==='bean'?'🫘 원두별 맞춤':'🧪 브루잉 레시피'}</div><h2>${r.t}</h2><div class=muted>${r.src}</div></div><span class="badge ${r.status==='verified'?'good':''}">${r.status==='verified'?'★ 검증 완료':'○ 테스트 전'}</span></div><div class=goal><b>맛의 목표</b><br>${scaleText(r.goal,ratio)}</div><div class=specs><div class=spec><b>원두량</b><div class=dose><input class=doseIn data-i=${i} type=number step=.5 min=5 max=60 value=${cur}><span>g</span></div></div><div class=spec><b>드리퍼</b>${r.drip==='neo'?'HARIO V60 NEO':r.drip==='beanplus'?'빈플러스':'V60 NEO / 빈플러스 공용'}</div><div class=spec><b>WaBliss 3.0</b>${r.grind}</div><div class=spec><b>물 온도</b>${r.temp}</div><div class=spec><b>뜨거운 물</b>${sg(r.hot)}</div><div class=spec><b>얼음</b>${scaleText(String(r.ice),ratio)}${/^\d/.test(String(r.ice))?'g':''}</div></div><h3>⏱ 따라 하기</h3>${st}<h3>🎯 마셔보고 조정</h3><ul>${r.adj.map(x=>`<li>${x}</li>`).join('')}</ul><div class=note>${r.note}</div></article>`}const filtersEl=document.querySelector('#filters'),list=document.querySelector('#list');filters();render();document.querySelector('#q').oninput=render;
</script></main></body></html>
